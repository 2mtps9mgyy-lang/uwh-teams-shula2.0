<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* Layout: one phone-width column, pool-tile header, scrolling main, fixed tab bar. */
:root{
  --bg:#e9f3f5; --surface:#ffffff; --ink:#0d2a33; --muted:#527079; --line:#cfe0e4;
  --water:#0b7285; --accent:#cc3358; --on-accent:#ffffff;
  --good:#2b8a3e; --bad:#c92a2a;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#061a20; --surface:#0e2a33; --ink:#e4f1f3; --muted:#8eafb7; --line:#1e424d;
    --water:#3bc9db; --accent:#ff7a96; --on-accent:#2b0611;
    --good:#69db7c; --bad:#ff8787; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#061a20; --surface:#0e2a33; --ink:#e4f1f3; --muted:#8eafb7; --line:#1e424d;
  --water:#3bc9db; --accent:#ff7a96; --on-accent:#2b0611;
  --good:#69db7c; --bad:#ff8787; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:34px;line-height:1.05;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:15px;font-family:var(--body);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
p{margin:0}
.app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);border-inline:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;color:#fff;
  background-color:#0b5c6b;
  background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);
  background-size:22px 22px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand-name{font-family:var(--display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.03em}

.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}

.bar span:last-child{background:#f6fafa}

.stepper{display:flex;flex-direction:column;align-items:center;gap:6px}
.stepper .ctl{display:flex;align-items:center;gap:12px}

label,legend{font-weight:600;font-size:14px}
input[type=text],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
input[type=range]{width:100%;accent-color:var(--accent)}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill span{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-weight:500;background:var(--surface)}
.pill input:checked + span{background:var(--water);border-color:var(--water);color:var(--surface)}
.pill input:focus-visible + span{outline:3px solid var(--water);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}
.err{color:var(--bad);font-weight:600;font-size:14px;min-height:1em}
.scrim{position:fixed;inset:0;background:rgba(2,16,20,.55)}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:20px 16px 24px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.sugg{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.sugg:last-child{border-bottom:0;padding-bottom:0}
.sugg-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.delta{font-family:var(--display);font-weight:700;font-size:22px}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.result{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.linkish{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;font-size:14px;align-self:flex-start}
</style>

<body>
<div class="app" id="app"></div>

<script id="logic">
const POS=['F','W','C','B'];
const POS_LABEL={F:'Forward',W:'Wing',C:'Center',B:'Fullback'};
const POS_CODE={F:'FW',W:'WG',C:'CE',B:'FB'};

// 6 v 6: 2 forwards, 2 wings, 1 center, 1 fullback. At 5 v 5, one forward fewer.
function needFor(perTeam){return perTeam>=6?{F:2,W:2,C:1,B:1}:{F:1,W:2,C:1,B:1};}

function rng32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function avg(team){return team.length?team.reduce((s,p)=>s+p.rating,0)/team.length:0;}
function can(p,pos){return p.main===pos||p.alt.includes(pos);}

// Cost of a split: average gap + position imbalance + uncovered positions.
function splitCost(A,B,need,parity){
  let c=Math.abs(avg(A)-avg(B));
  for(const pos of POS){
    let a=0,b=0,ca=0,cb=0;
    for(const p of A){if(p.main===pos)a++;if(can(p,pos))ca++;}
    for(const p of B){if(p.main===pos)b++;if(can(p,pos))cb++;}
    c+=2.5*Math.max(0,Math.abs(a-b)-parity[pos]);
    c+=6*(Math.max(0,need[pos]-ca)+Math.max(0,need[pos]-cb));
    c+=1.5*(Math.max(0,need[pos]-a)+Math.max(0,need[pos]-b));
  }
  return c;
}
function signature(A,B){const s=t=>t.map(p=>p.id).sort((x,y)=>x-y).join(',');return [s(A),s(B)].sort().join('|');}

// Everyone starts at their main position; a short position is filled by a player
// from an overstaffed position who has it as a secondary.
function assignPositions(team,need){
  const pos={},count={F:0,W:0,C:0,B:0};
  for(const p of team){pos[p.id]=p.main;count[p.main]++;}
  let moved=true;
  while(moved){
    moved=false;
    for(const t of POS){
      if(count[t]>=need[t])continue;
      let donor=null;
      for(const p of team){
        const q=pos[p.id];
        if(q!==t&&q===p.main&&count[q]>need[q]&&p.alt.includes(t)){
          if(!donor||count[q]-need[q]>count[pos[donor.id]]-need[pos[donor.id]])donor=p;
        }
      }
      if(donor){count[pos[donor.id]]--;pos[donor.id]=t;count[t]++;moved=true;}
    }
  }
  return pos;
}

// Search: random starts + player swaps while the cost drops.
// `avoid` holds splits already shown, to get a different one.
function makeTeams(players,rnd,avoid){
  rnd=rnd||Math.random;avoid=avoid||[];
  const n=players.length,sizeA=Math.ceil(n/2);
  const need=needFor(Math.floor(n/2));
  const parity={};
  for(const pos of POS)parity[pos]=players.filter(p=>p.main===pos).length%2;
  const found=new Map();
  for(let r=0;r<80;r++){
    const o=shuffle(players,rnd),A=o.slice(0,sizeA),B=o.slice(sizeA);
    let cost=splitCost(A,B,need,parity),improved=true;
    while(improved){
      improved=false;
      for(let i=0;i<A.length;i++)for(let j=0;j<B.length;j++){
        const t=A[i];A[i]=B[j];B[j]=t;
        const c=splitCost(A,B,need,parity);
        if(c<cost-1e-9){cost=c;improved=true;}else{B[j]=A[i];A[i]=t;}
      }
    }
    const sig=signature(A,B);
    if(!found.has(sig))found.set(sig,{sig,cost,A,B});
  }
  const list=[...found.values()].sort((x,y)=>x.cost-y.cost);
  const best=list[0];
  const pick=list.find(x=>!avoid.includes(x.sig)&&x.cost<=best.cost+1.5)||list.find(x=>!avoid.includes(x.sig))||best;
  return {A:pick.A,B:pick.B,sig:pick.sig,cost:pick.cost,format:need.F===2?6:5,
    avgA:avg(pick.A),avgB:avg(pick.B),
    assign:Object.assign({},assignPositions(pick.A,need),assignPositions(pick.B,need))};
}

// Recurring results: over a player's last 6 matches (4 minimum), compare results
// with what the average gap predicted. Clear streak => suggestion.
function suggestAdjustments(players,matches){
  const out=[];
  for(const p of players){
    const rel=[];
    matches.forEach((m,i)=>{
      if(i<(p.adjFrom||0))return;
      const inA=m.A.includes(p.id),inB=m.B.includes(p.id);
      if(!inA&&!inB)return;
      const expA=1/(1+Math.pow(10,(m.avgB-m.avgA)/20));
      const resA=m.scoreA>m.scoreB?1:m.scoreA<m.scoreB?0:0.5;
      rel.push(inA?{res:resA,exp:expA}:{res:1-resA,exp:1-expA});
    });
    const last=rel.slice(-6);
    if(last.length<4)continue;
    let s=0,w=0,d=0,l=0;
    for(const r of last){s+=r.res-r.exp;if(r.res===1)w++;else if(r.res===0)l++;else d++;}
    if(Math.abs(s)<1.25)continue;
    const delta=Math.max(-5,Math.min(5,Math.round(s*2)));
    const to=Math.max(1,Math.min(100,p.rating+delta));
    if(to===p.rating)continue;
    out.push({id:p.id,delta:to-p.rating,to,w,d,l,n:last.length});
  }
  return out.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
}

// Club members, ratings and positions as set by the club admin.
function seedPlayers(){
  const raw=[["Zoé", 61, "F", ["W"], 0], ["Sam", 61, "F", [], 0], ["Chiche Diaz", 66, "W", ["F", "B"], 0], ["Adrian", 75, "W", ["F", "B"], 0], ["Marta", 46, "W", ["F"], 0], ["Jorge", 89, "C", ["F", "W"], 1], ["Ale", 53, "F", ["W"], 0], ["Marina", 61, "B", ["W"], 0], ["Chuches", 90, "C", ["F", "W", "B"], 1], ["Fer", 77, "B", ["F", "W"], 0], ["Moisés", 69, "B", ["W"], 0], ["María", 46, "F", ["W"], 0], ["Merxe", 55, "W", ["F", "B"], 0], ["Jelle Gorter", 45, "F", ["W"], 0], ["Clara Martínez", 64, "C", ["F", "W"], 0], ["Alberto", 69, "B", ["F", "W", "C"], 0]];
  return raw.map((r,i)=>({id:i+2,name:r[0],rating:r[1],main:r[2],alt:r[3],admin:!!r[4],pin:'1234',adjFrom:0}));
}
function seedMatches(players,dates){
  const rnd=rng32(2026),star=players.find(p=>p.name==='Sam'),low=players.find(p=>p.name==='Alberto'),out=[];
  for(let k=0;k<dates.length;k++){
    const pick=shuffle(players.filter(p=>p!==star&&p!==low),rnd).slice(0,10).concat([star,low]);
    const t=makeTeams(pick,rnd),A=t.A,B=t.B;
    if(A.includes(star)===A.includes(low)){
      const from=A.includes(star)?A:B,to=from===A?B:A;
      let sw=to[0];
      for(const p of to)if(Math.abs(p.rating-low.rating)<Math.abs(sw.rating-low.rating))sw=p;
      from[from.indexOf(low)]=sw;to[to.indexOf(sw)]=low;
    }
    const aWins=A.includes(star)===(k!==2);
    const hi=3+Math.floor(rnd()*3),lo=Math.floor(rnd()*3);
    out.push({date:dates[k],A:A.map(p=>p.id),B:B.map(p=>p.id),avgA:avg(A),avgB:avg(B),scoreA:aWins?hi:lo,scoreB:aWins?lo:hi});
  }
  return out;
}
</script>

<script id="app-code">
(function(){
const KEY='hsub-proto-v2';
const root=document.getElementById('app');
let state,toastTimer=null;

function nextSession(now){
  const d=new Date(now);d.setHours(21,30,0,0);
  // Sessions on Tuesdays and Thursdays, 9:30 PM.
  for(let i=0;i<8;i++){const g=d.getDay();if((g===2||g===4)&&d>now)break;d.setDate(d.getDate()+1);}
  return d;
}
function freshState(){
  const players=seedPlayers(),nt=nextSession(new Date());
  return {v:2,players,nextId:players.length+2,sessionDate:nt.toISOString(),
    registered:[],teams:null,seen:[],
    matches:[],mig:2,me:null,tab:'seance',sheet:null,scoreForm:null,loginErr:'',toast:''};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
const RATINGS={"Chuches": 90, "Jorge": 89, "Fer": 77, "Adrian": 75, "Moisés": 69, "Alberto": 69, "Chiche Diaz": 66, "Clara Martínez": 64, "Sam": 61, "Marina": 61, "Zoé": 61, "Merxe": 55, "Ale": 53, "Marta": 46, "María": 46, "Jelle Gorter": 45};
// Move to real ratings without touching positions already entered in this browser.
function migrate(s){
  if(s.mig===1){for(const p of s.players){if(p.name==='Jorge')p.rating=89;if(p.name==='Zoé')p.rating=61;}s.teams=null;s.seen=[];s.mig=2;return s;}
  if(s.mig)return s;
  const ch=s.players.find(p=>p.name==='Chuches'),hy=s.players.find(p=>p.name==='Hyacinthe');
  if(hy&&ch){
    s.players=s.players.filter(p=>p!==hy);s.registered=s.registered.filter(x=>x!==hy.id);
    if(s.me===hy.id)s.me=ch.id;
  }
  if(ch)ch.admin=true;
  for(const p of s.players){if(RATINGS[p.name]!=null)p.rating=RATINGS[p.name];p.adjFrom=0;}
  s.matches=[];s.teams=null;s.seen=[];s.scoreForm=null;s.sheet=null;s.mig=2;
  return s;
}
function load(hot){
  if(hot&&hot.v===2)return migrate(hot);
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===2)return migrate(s);}catch(e){}
  return freshState();
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>state.players.find(p=>p.id===id);
const me=()=>byId(state.me);
const isAdmin=()=>!!(me()&&me().admin);
const fr1=n=>n.toFixed(1);
const fmtDate=iso=>new Date(iso).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
const fmtShort=iso=>new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
function toast(msg){state.toast=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast='';render();},2600);}
function formatInfo(n){
  const per=Math.floor(n/2);
  if(n<10)return {ok:false,text:'At least 10 players are needed to make two teams of 5.'};
  const f=per>=6?6:5,subs=per-f;
  return {ok:true,text:f+' v '+f+(subs>0?' · '+subs+' sub'+(subs>1?'s':'')+' per team':'')+(n%2?' · Black has one extra player':'')};
}

function posChips(p){
  return '<span class="pos" title="'+POS_LABEL[p.main]+'">'+POS_CODE[p.main]+'</span>'+
    p.alt.map(a=>'<span class="pos alt" title="'+POS_LABEL[a]+' (secondary)">'+POS_CODE[a]+'</span>').join('');
}

function viewLogin(){
  return '<main><div><h1>Who are you?</h1><p class="muted">Pick your name and enter your code.</p></div>'+
  '<div class="card">'+
    '<div class="field"><label for="login-name">Your name</label><select id="login-name">'+
      state.players.slice().sort((a,b)=>a.name.localeCompare(b.name,'en')).map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></div>'+
    '<div class="field"><label for="login-pin">Your 4-digit code</label><input type="text" id="login-pin" inputmode="numeric" maxlength="4" autocomplete="off"></div>'+
    '<p class="err" role="alert">'+esc(state.loginErr)+'</p>'+
    '<button class="btn primary" data-act="login">Sign in</button>'+
  '</div>'+
  '<div class="card"><h3>Try the prototype</h3><p class="muted">Every code is 1234.</p>'+
    '<div class="btns"><button class="btn" data-act="demo" data-id="'+(state.players.find(p=>p.admin)||{}).id+'">View as admin</button>'+
    '<button class="btn" data-act="demo" data-id="'+(state.players.find(p=>!p.admin)||{}).id+'">View as player</button></div>'+
    '<button class="linkish" data-act="reset">Reset to sample data</button></div></main>';
}

function viewSeance(){
  const admin=isAdmin(),reg=state.registered.map(byId).filter(Boolean),inIt=state.registered.includes(state.me);
  const info=formatInfo(reg.length);
  const sorted=reg.slice().sort((a,b)=>admin?b.rating-a.rating:a.name.localeCompare(b.name,'en'));
  let h='<div class="card"><h3>Next session</h3><h1>'+esc(fmtDate(state.sessionDate))+'</h1><p class="muted">9:30 PM</p>'+
    '<div class="kpis"><div><span class="big">'+reg.length+'</span><span class="muted">signed up</span></div><p class="muted" style="flex:1;min-width:150px">'+esc(info.text)+'</p></div>'+
    '<button class="btn '+(inIt?'':'primary')+'" data-act="toggle-me">'+(inIt?'I\'m out':'I\'m in')+'</button></div>';
  h+='<div class="card"><h3>Signed up</h3><ul class="list">'+(sorted.length?sorted.map(p=>
    '<li class="row">'+posChips(p)+'<span class="name">'+esc(p.name)+(p.id===state.me?' <span class="tag">me</span>':'')+'</span>'+
    (admin?'<span class="rate">'+p.rating+'</span><button class="btn small" data-act="unreg" data-id="'+p.id+'" aria-label="Remove '+esc(p.name)+'">Remove</button>':'')+'</li>').join(''):'<li class="row muted">Nobody yet.</li>')+'</ul></div>';
  if(admin){
    const out=state.players.filter(p=>!state.registered.includes(p.id)).sort((a,b)=>a.name.localeCompare(b.name,'en'));
    h+='<div class="card"><h3>Not signed up yet</h3><ul class="list">'+out.map(p=>
      '<li class="row">'+posChips(p)+'<span class="name">'+esc(p.name)+'</span><span class="rate">'+p.rating+'</span>'+
      '<button class="btn small" data-act="reg" data-id="'+p.id+'" aria-label="Add '+esc(p.name)+'">Add</button></li>').join('')+'</ul></div>';
  }
  return '<main>'+h+'</main>';
}

function teamCard(cls,label,ids,t,admin){
  const ps=ids.map(byId).filter(Boolean);
  let rows='';
  for(const pos of POS){
    ps.filter(p=>(t.assign[p.id]||p.main)===pos).sort((a,b)=>b.rating-a.rating).forEach(p=>{
      const second=(t.assign[p.id]||p.main)!==p.main;
      rows+='<li class="row"><span class="pos'+(second?' alt':'')+'" title="'+POS_LABEL[pos]+(second?' (secondary position)':'')+'">'+POS_CODE[pos]+'</span>'+
        '<span class="name">'+esc(p.name)+'</span>'+(admin?'<span class="rate">'+p.rating+'</span>':'')+'</li>';
    });
  }
  return '<div class="team '+cls+'"><div class="team-head"><span>'+label+'</span>'+(admin?'<small>avg '+fr1(avg(ps))+'</small>':'')+'</div><ul class="list">'+rows+'</ul></div>';
}
function viewEquipes(){
  const admin=isAdmin(),t=state.teams,n=state.registered.length,info=formatInfo(n);
  if(!t){
    if(!admin)return '<main><div class="card"><h2>Teams</h2><p class="muted">Teams are not published yet. They will show up here once an admin generates them.</p></div></main>';
    return '<main><div class="card"><h2>Teams</h2><p>'+n+' signed up. '+esc(info.text)+'</p>'+
      '<p class="muted">The app looks for the split where both averages are closest, with the same number of forwards, wings, centers and fullbacks on each side.</p>'+
      '<button class="btn primary" data-act="gen"'+(info.ok?'':' disabled')+'>Generate teams</button></div></main>';
  }
  const A=t.A.map(byId).filter(Boolean),B=t.B.map(byId).filter(Boolean);
  let h='';
  if(admin){
    const sa=A.reduce((s,p)=>s+p.rating,0),sb=B.reduce((s,p)=>s+p.rating,0);
    h+='<div class="card"><div class="kpis"><div><span class="big">'+fr1(Math.abs(avg(A)-avg(B)))+'</span><span class="muted">point gap between averages</span></div>'+
      '<p class="muted" style="flex:1;min-width:150px">'+esc(info.text)+'</p></div>'+
      '<div class="bar" role="img" aria-label="Black and White team strength"><span style="flex:'+sa+'"></span><span style="flex:'+sb+'"></span></div></div>';
  }else{
    h+='<div><h2>Teams for '+esc(fmtDate(state.sessionDate))+'</h2><p class="muted">'+esc(info.text)+'</p></div>';
  }
  h+='<div class="teams">'+teamCard('noirs','Black',t.A,t,admin)+teamCard('blancs','White',t.B,t,admin)+'</div>';
  h+='<p class="muted">FW forward · WG wing · CE center · FB fullback. An outlined tag is a secondary position.</p>';
  if(admin){
    if(state.scoreForm){
      const f=state.scoreForm;
      const step=(k,label)=>'<div class="stepper"><span class="muted">'+label+'</span><div class="ctl">'+
        '<button class="btn" data-act="score" data-k="'+k+'" data-d="-1" aria-label="Remove a goal from '+label+'">−</button>'+
        '<span class="big">'+f[k]+'</span>'+
        '<button class="btn" data-act="score" data-k="'+k+'" data-d="1" aria-label="Add a goal to '+label+'">+</button></div></div>';
      h+='<div class="card"><h3>Match result</h3><div class="score">'+step('a','Black')+step('b','White')+'</div>'+
        '<div class="btns"><button class="btn primary" data-act="save-score">Save result</button><button class="btn" data-act="cancel-score">Cancel</button></div></div>';
    }else{
      h+='<div class="btns"><button class="btn" data-act="gen">Another split</button><button class="btn primary" data-act="open-score">Enter result</button></div>';
    }
  }
  return '<main>'+h+'</main>';
}

function viewJoueurs(){
  const ps=state.players.slice().sort((a,b)=>b.rating-a.rating);
  return '<main><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2>'+ps.length+' members</h2>'+
    '<button class="btn small" data-act="edit" data-id="new">Add</button></div>'+
    '<div class="card"><ul class="list">'+ps.map(p=>
      '<li><button class="row" data-act="edit" data-id="'+p.id+'">'+posChips(p)+'<span class="name">'+esc(p.name)+(p.admin?' <span class="tag">admin</span>':'')+'</span><span class="rate">'+p.rating+'</span></button></li>').join('')+
    '</ul></div><p class="muted">Filled tag: main position. Outlined tag: secondary position. Tap a row to edit the profile.</p>'+
    '<div class="card"><h3>Export</h3><button class="btn" data-act="export">Copy club data</button>'+
    (state.exportText?'<p class="muted">If nothing was copied, select this text and copy it.</p><textarea id="export-text" readonly rows="5" style="width:100%;font:12px monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);color:var(--ink)">'+esc(state.exportText)+'</textarea>':'')+'</div></main>';
}

function viewSheet(){
  const isNew=state.sheet==='new';
  const p=isNew?{name:'',rating:60,main:'F',alt:[],admin:false,pin:'1234'}:byId(state.sheet);
  if(!p)return '';
  return '<div class="scrim" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">'+
    '<h2 id="sheet-title">'+(isNew?'New member':'Profile: '+esc(p.name))+'</h2>'+
    '<div class="field"><label for="f-name">Name</label><input type="text" id="f-name" value="'+esc(p.name)+'"></div>'+
    '<div class="field"><label for="f-rating">Rating: <output id="f-rating-out" for="f-rating">'+p.rating+'</output> / 100</label><input type="range" id="f-rating" min="1" max="100" value="'+p.rating+'"></div>'+
    '<fieldset><legend>Main position</legend><div class="pills">'+POS.map(k=>
      '<label class="pill"><input type="radio" name="f-main" id="f-main-'+k+'" value="'+k+'"'+(p.main===k?' checked':'')+'><span>'+POS_LABEL[k]+'</span></label>').join('')+'</div></fieldset>'+
    '<fieldset><legend>Can also play</legend><div class="pills">'+POS.map(k=>
      '<label class="pill"><input type="checkbox" name="f-alt" id="f-alt-'+k+'" value="'+k+'"'+(p.alt.includes(k)?' checked':'')+'><span>'+POS_LABEL[k]+'</span></label>').join('')+'</div></fieldset>'+
    '<label class="check" for="f-admin"><input type="checkbox" id="f-admin"'+(p.admin?' checked':'')+'><span>Premium access: sees and edits ratings, positions and results</span></label>'+
    '<div class="field"><label for="f-pin">4-digit code</label><input type="text" id="f-pin" inputmode="numeric" maxlength="4" value="'+esc(p.pin)+'"></div>'+
    '<p class="err" id="f-err" role="alert"></p>'+
    '<div class="btns"><button class="btn primary" data-act="save-player">Save</button><button class="btn" data-act="close-sheet">Cancel</button></div>'+
    (!isNew&&p.id!==state.me?'<button class="btn danger" data-act="del-player">Remove from club</button>':'')+'</div>';
}

function viewResultats(){
  const sugg=suggestAdjustments(state.players,state.matches);
  let h='<div class="card"><h3>Ratings to review</h3>';
  if(!sugg.length)h+='<p class="muted">No clear streak yet.</p>';
  else h+='<div>'+sugg.map(s=>{
    const p=byId(s.id),up=s.delta>0;
    return '<div class="sugg"><div class="sugg-head"><span class="name" style="font-size:18px;font-weight:600">'+esc(p.name)+'</span>'+
      '<span class="rate" style="min-width:0">'+p.rating+' → '+s.to+'</span><span class="delta '+(up?'up':'down')+'">'+(up?'+':'−')+Math.abs(s.delta)+'</span></div>'+
      '<p class="muted">'+s.w+' win'+(s.w!==1?'s':'')+', '+(s.d?s.d+' draw'+(s.d>1?'s':'')+', ':'')+s.l+' loss'+(s.l!==1?'es':'')+' in the last '+s.n+' matches, in balanced teams.</p>'+
      '<div class="btns"><button class="btn small primary" data-act="apply" data-id="'+s.id+'" data-to="'+s.to+'">Apply</button>'+
      '<button class="btn small" data-act="ignore" data-id="'+s.id+'">Dismiss</button></div></div>';
  }).join('')+'</div>';
  h+='<p class="muted">The app suggests, an admin decides. A change is only suggested after at least 4 matches and a clear streak, 5 points at most each time.</p></div>';
  h+='<div class="card"><h3>Recorded matches</h3><ul class="list">'+state.matches.slice().reverse().map(m=>
    '<li class="row"><span class="name">'+esc(fmtShort(m.date))+' <span class="muted">· '+(m.A.length+m.B.length)+' players</span></span>'+
    '<span class="result">Black '+m.scoreA+' – '+m.scoreB+' White</span></li>').join('')+(state.matches.length?'':'<li class="row muted">No match recorded.</li>')+'</ul></div>';
  return '<main>'+h+'</main>';
}

function render(){
  const u=me();
  let h='<header class="top"><div class="brand"><span class="brand-name">UWH Madrid</span><span class="brand-tag">prototype</span></div>'+
    (u?'<button class="who" data-act="logout">'+esc(u.name)+(u.admin?' · admin':'')+' · Switch</button>':'')+'</header>';
  if(!u){root.innerHTML=h+viewLogin();return;}
  const admin=u.admin;
  if(!admin&&(state.tab==='joueurs'||state.tab==='resultats'))state.tab='seance';
  h+=state.tab==='equipes'?viewEquipes():state.tab==='joueurs'?viewJoueurs():state.tab==='resultats'?viewResultats():viewSeance();
  const tabs=[['seance','Session'],['equipes','Teams']].concat(admin?[['joueurs','Players'],['resultats','Results']]:[]);
  h+='<nav class="tabs" aria-label="Sections">'+tabs.map(t=>'<button data-act="tab" data-tab="'+t[0]+'"'+(state.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>').join('')+'</nav>';
  if(state.sheet&&admin)h+=viewSheet();
  if(state.toast)h+='<div class="toast" role="status">'+esc(state.toast)+'</div>';
  root.innerHTML=h;
}

function regChanged(){if(state.teams){state.teams=null;state.seen=[];state.scoreForm=null;toast('Sign-ups changed: regenerate the teams.');}}

const acts={
  login(){
    const id=+document.getElementById('login-name').value,pin=document.getElementById('login-pin').value.trim(),p=byId(id);
    if(!p||p.pin!==pin){state.loginErr='Wrong code. In the prototype, the code is 1234.';return;}
    state.loginErr='';state.me=id;state.tab='seance';
  },
  demo(el){state.me=+el.dataset.id;state.loginErr='';state.tab='seance';},
  logout(){state.me=null;state.sheet=null;state.scoreForm=null;},
  reset(){state=freshState();},
  tab(el){state.tab=el.dataset.tab;state.sheet=null;state.exportText='';},
  'toggle-me'(){
    const i=state.registered.indexOf(state.me);
    if(i>=0)state.registered.splice(i,1);else state.registered.push(state.me);
    regChanged();
  },
  reg(el){if(!isAdmin())return;const id=+el.dataset.id;if(!state.registered.includes(id))state.registered.push(id);regChanged();},
  unreg(el){if(!isAdmin())return;state.registered=state.registered.filter(x=>x!==+el.dataset.id);regChanged();},
  gen(){
    if(!isAdmin())return;
    const ps=state.registered.map(byId).filter(Boolean);
    if(ps.length<10)return;
    const t=makeTeams(ps,Math.random,state.seen);
    if(state.seen.includes(t.sig)){state.seen=[];toast('All good splits have been shown, starting again from the best one.');}
    state.seen.push(t.sig);
    state.teams={A:t.A.map(p=>p.id),B:t.B.map(p=>p.id),assign:t.assign,format:t.format};
    state.scoreForm=null;
  },
  'open-score'(){state.scoreForm={a:0,b:0};},
  'cancel-score'(){state.scoreForm=null;},
  score(el){const f=state.scoreForm;if(!f)return;f[el.dataset.k]=Math.max(0,Math.min(30,f[el.dataset.k]+ +el.dataset.d));},
  'save-score'(){
    if(!isAdmin()||!state.teams||!state.scoreForm)return;
    const A=state.teams.A.map(byId).filter(Boolean),B=state.teams.B.map(byId).filter(Boolean);
    state.matches.push({date:state.sessionDate,A:A.map(p=>p.id),B:B.map(p=>p.id),avgA:avg(A),avgB:avg(B),scoreA:state.scoreForm.a,scoreB:state.scoreForm.b});
    state.teams=null;state.seen=[];state.scoreForm=null;state.tab='resultats';
    toast('Result saved.');
  },
  export(){
    if(!isAdmin())return;
    const txt=JSON.stringify(state.players.map(p=>[p.name,p.rating,p.main,p.alt,p.admin?1:0]));
    state.exportText=txt;
    try{navigator.clipboard.writeText(txt).then(()=>{toast('Club data copied.');render();}).catch(()=>{});}catch(e){}
  },
  edit(el){if(!isAdmin())return;state.sheet=el.dataset.id==='new'?'new':+el.dataset.id;},
  'close-sheet'(){state.sheet=null;},
  'save-player'(){
    if(!isAdmin())return 'stay';
    const name=document.getElementById('f-name').value.trim(),pin=document.getElementById('f-pin').value.trim();
    const err=document.getElementById('f-err');
    if(!name){err.textContent='Enter a name.';return 'stay';}
    if(!/^\d{4}$/.test(pin)){err.textContent='The code must be 4 digits.';return 'stay';}
    const main=(document.querySelector('input[name="f-main"]:checked')||{}).value||'F';
    const alt=[...document.querySelectorAll('input[name="f-alt"]:checked')].map(i=>i.value).filter(k=>k!==main);
    const data={name,pin,rating:+document.getElementById('f-rating').value,main,alt,admin:document.getElementById('f-admin').checked};
    if(state.sheet==='new')state.players.push(Object.assign({id:state.nextId++,adjFrom:state.matches.length},data));
    else{
      const p=byId(state.sheet);
      if(p.id===state.me)data.admin=true;
      const changed=p.rating!==data.rating||p.main!==data.main||p.alt.join()!==data.alt.join();
      Object.assign(p,data);
      if(changed&&state.teams&&state.registered.includes(p.id)){state.teams=null;state.seen=[];toast('Profile changed: regenerate the teams.');}
    }
    state.sheet=null;
  },
  'del-player'(el){
    if(!isAdmin())return 'stay';
    if(!el.dataset.confirm){el.dataset.confirm='1';el.textContent='Confirm removal';return 'stay';}
    const id=state.sheet;
    state.players=state.players.filter(p=>p.id!==id);
    const was=state.registered.includes(id);
    state.registered=state.registered.filter(x=>x!==id);
    if(was)regChanged();
    state.sheet=null;
  },
  apply(el){if(!isAdmin())return;const p=byId(+el.dataset.id);p.rating=+el.dataset.to;p.adjFrom=state.matches.length;toast('Rating updated for '+p.name+'.');},
  ignore(el){if(!isAdmin())return;byId(+el.dataset.id).adjFrom=state.matches.length;}
};

root.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||!acts[el.dataset.act])return;
  const r=acts[el.dataset.act](el);
  if(r==='stay')return;
  save();render();
});
root.addEventListener('input',e=>{
  if(e.target.id==='f-rating'){const o=document.getElementById('f-rating-out');if(o)o.textContent=e.target.value;}
});
root.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='login-pin'){acts.login();save();render();}
  if(e.key==='Escape'&&state.sheet){state.sheet=null;render();}
});

function start(hot){state=load(hot);state.toast='';render();}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>state);
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data);
})();
</script>
</body>
</html>
